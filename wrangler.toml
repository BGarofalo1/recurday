# Recurday Day-1.
# Do not point any preview/production IDs at other projects (especially Peerkith KV).
# Media is in Workers KV for now (free, no card). See src/storage.js to switch back to R2.

name = "recurday"
main = "src/worker.js"
compatibility_date = "2026-11-15"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# Static files (CSS, JS, icons, and the prebuilt Ideas/About/Privacy/Terms
# pages) are served straight from Cloudflare without running the Worker.
# Static asset requests are free and unlimited; only the paths below count
# toward the Workers Free plan's 100,000 requests/day.
# https://developers.cloudflare.com/workers/static-assets/billing-and-limitations/
run_worker_first = [
  "/",
  "/index.html",
  "/api/*",
  "/media/*",
  "/t/*",
  "/a/*",
  "/s/*",
  "/f/*",
  "/calendar",
  "/cal/*",
  "/family/*",
  "/offline.html",
]

[vars]
# "kv" today. Set to "r2" after swapping the binding below for an R2 bucket.
MEDIA_BACKEND = "kv"

[[d1_databases]]
binding = "DB"
database_name = "recurday"
database_id = "c4b9baba-6d10-42d8-aab2-2079cbc27315"
migrations_dir = "migrations"

# Private media store. Not listable and not served except through /media/?t=...
[[kv_namespaces]]
binding = "MEDIA"
id = "f4fcaf57c312459e99f6b5f9766e8408"

# To switch back to private R2 later, comment out the kv_namespaces block above
# and uncomment:
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "recurday-media"
